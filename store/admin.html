<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel | ASH CS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 0; margin: 0; background: #0A192F; }
    .navbar { background: #111827; padding: 16px; display: flex; justify-content: space-between; align-items: center; position: fixed; top: 0; left: 0; right: 0; z-index: 50; }
    .logo { color: #FBBF24; font-size: 24px; font-weight: bold; text-decoration: none; }
    .menu-btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; min-width: 44px; min-height: 44px; }
    .mobile-menu { background: #111827; padding: 0 16px; position: fixed; top: 60px; left: 0; right: 0; z-index: 40; max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out, padding 0.3s ease-out; }
    .mobile-menu.active { max-height: 400px; padding: 16px; }
    .mobile-menu a { color: white; display: block; padding: 8px; text-decoration: none; }
    .mobile-menu a:hover { color: #FBBF24; }
    .admin-section { padding: 100px 20px 40px; color: white; }
    .admin-card { background: #112240; border-radius: 12px; padding: 24px; max-width: 1000px; margin: 0 auto; border: 2px solid rgba(212,175,55,0.2); }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(212,175,55,0.2); }
    th { color: #D4AF37; font-weight: bold; }
    td { color: #e2e8f0; }
    .btn { min-height: 44px; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; border: none; }
    .btn-edit { background: #FBBF24; color: #111827; }
    .btn-delete { background: #ef4444; color: white; }
    .btn-add { background: #22c55e; color: white; }
    .btn-logout { background: #ef4444; color: white; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; }
    .modal.active { display: flex !important; }
    .modal-content { background: #112240; padding: 24px; border-radius: 12px; max-width: 500px; width: 90%; border: 2px solid rgba(212,175,55,0.2); }
    .modal-content input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid rgba(212,175,55,0.2); border-radius: 8px; background: #0A192F; color: white; font-size: 16px; min-height: 44px; }
    .modal-content input:focus { outline: none; border-color: #D4AF37; }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <a href="index.html" class="logo">ASH CS</a>
    <div style="display: flex; align-items: center; gap: 12px;">
      <button class="btn btn-logout" onclick="handleLogout()" data-i18n="btn.logout">Logout</button>
      <button class="menu-btn" onclick="toggleMenu()">☰</button>
    </div>
    <div class="mobile-menu" id="mobileMenu">
      <a href="index.html" data-i18n="nav.home">Home</a>
      <a href="services.html" data-i18n="nav.services">Services</a>
      <a href="cart.html" data-i18n="nav.cart">Cart</a>
      <a href="about.html" data-i18n="nav.about">About</a>
      <a href="contact.html" data-i18n="nav.contact">Contact</a>
      <a href="info.html" data-i18n="nav.info">Info</a>
      <a href="entry.html" style="color: #D4AF37; font-weight: bold;" data-i18n="nav.seller-login">Seller Login</a>
      <a href="admin.html" id="admin-link" style="color: #D4AF37; font-weight: bold;" data-i18n="nav.admin-panel">Admin Panel</a>
      <button id="lang-switch" style="background: #FBBF24; color: #111827; font-weight: bold; min-height: 44px; padding: 8px 16px; border-radius: 8px; border: none; width: 100%; text-align: left; margin-top: 8px;" data-i18n="lang.switch">AR</button>
    </div>
  </nav>

  <!-- Admin Panel -->
  <section class="admin-section">
    <div class="admin-card">
      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
        <h1 style="font-size: 28px; font-weight: bold; color: #D4AF37;" data-i18n="admin.title">Service Management</h1>
        <button class="btn btn-add" onclick="openAddModal()" data-i18n="btn.add-service">+ Add New Service</button>
      </div>
      <table>
        <thead>
          <tr>
            <th data-i18n="admin.service">Service</th>
            <th data-i18n="admin.price">Price (AED)</th>
            <th data-i18n="admin.discount">Discount</th>
            <th data-i18n="admin.actions">Actions</th>
          </tr>
        </thead>
        <tbody id="servicesTableBody"></tbody>
      </table>
    </div>
  </section>

  <!-- Edit Modal -->
  <div class="modal" id="editModal">
    <div class="modal-content">
      <h2 style="color: #D4AF37; font-size: 22px; font-weight: bold; margin-bottom: 16px;" data-i18n="admin.edit-title">Edit Service</h2>
      <input type="hidden" id="edit-service-id">
      <label style="color: #e2e8f0;" data-i18n="admin.price">Price (AED)</label>
      <input type="number" id="edit-service-price" min="0">
      <label style="color: #e2e8f0;" data-i18n="admin.discount">Discount (%)</label>
      <input type="number" id="edit-service-discount" min="0" max="100">
      <div style="display: flex; gap: 12px; margin-top: 16px;">
        <button class="btn btn-edit" onclick="saveEdit()" style="flex: 1;" data-i18n="btn.save">Save</button>
        <button class="btn" onclick="closeModal('editModal')" style="flex: 1; background: transparent; color: #e2e8f0; border: 1px solid #e2e8f0;" data-i18n="btn.cancel">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Add Modal -->
  <div class="modal" id="addModal">
    <div class="modal-content">
      <h2 style="color: #D4AF37; font-size: 22px; font-weight: bold; margin-bottom: 16px;" data-i18n="admin.add-title">Add New Service</h2>
      <input type="text" id="add-service-name" placeholder="Service Name (English)" data-i18n="admin.name-en">
      <input type="text" id="add-service-name-ar" data-en-placeholder="Service Name (Arabic)" data-ar-placeholder="اسم الخدمة (عربي)" placeholder="اسم الخدمة">
      <input type="number" id="add-service-price" placeholder="Price (AED)" min="0" data-i18n="admin.price">
      <input type="number" id="add-service-discount" placeholder="Discount (%)" min="0" max="100" data-i18n="admin.discount">
      <input type="text" id="add-service-image" placeholder="Image path (e.g., images/services/ui-ux.svg)" data-i18n="admin.image-path">
      <div style="display: flex; gap: 12px; margin-top: 16px;">
        <button class="btn btn-add" onclick="saveAdd()" style="flex: 1;" data-i18n="btn.add-save">Add Service</button>
        <button class="btn" onclick="closeModal('addModal')" style="flex: 1; background: transparent; color: #e2e8f0; border: 1px solid #e2e8f0;" data-i18n="btn.cancel">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Floating Buttons -->
  <div id="floating-buttons" style="position: fixed; bottom: 32px; right: 32px; display: flex; flex-direction: column; gap: 16px; z-index: 999;">
    <a href="cart.html" style="background: #FBBF24; color: #111827; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(251,191,36,0.3); transition: transform 0.3s; text-decoration: none;" onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'">
      <svg width="30" height="30" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.2 2M7 13h10l2-8H5.4M7 13L5.4 5M7 13l-2.1 4M17 13a2 2 0 1 0 0 4 0z"></path></svg>
    </a>

  </div>

  <script src="js/main.js"></script>
  <script src="js/services.js"></script>
  <script>
    function toggleMenu() {
      document.getElementById("mobileMenu").classList.toggle("active");
    }

    // Login guard
    if (localStorage.getItem("isAdminLoggedIn") !== "true") {
      window.location.href = "entry.html";
    }

    function handleLogout() {
      localStorage.removeItem("isAdminLoggedIn");
      window.location.href = "entry.html";
    }

    function renderServicesTable() {
      var tbody = document.getElementById("servicesTableBody");
      if (!tbody) return;
      tbody.innerHTML = "";
      
      for (var i = 0; i < services.length; i++) {
        var s = services[i];
        var finalPrice = calculateFinalPrice(s);
        var tr = document.createElement("tr");
        tr.innerHTML = 
          "<td>" + s.name.en + "</td>" +
          "<td>" + (s.discountPercentage > 0 ? 
            '<span style="text-decoration:line-through;color:#6B7280;">' + s.originalPrice + '</span> ' +
            '<span style="color:#D4AF37;font-weight:bold;">' + finalPrice + '</span>' :
            '<span style="color:#D4AF37;font-weight:bold;">' + s.originalPrice + '</span>'
          ) + "</td>" +
          "<td>" + (s.discountPercentage > 0 ? s.discountPercentage + (typeof t === 'function' ? t('admin.off') : '% OFF') : "—") + "</td>" +
          "<td>" +
            '<button class="btn btn-edit" onclick="openEditModal(\'' + s.id + '\')" style="margin-right: 8px;">' + (typeof t === 'function' ? t('btn.edit') : 'Edit') + '</button>' +
            '<button class="btn btn-delete" onclick="handleDeleteService(\'' + s.id + '\')">' + (typeof t === 'function' ? t('btn.delete') : 'Delete') + '</button>' +
          "</td>";
        tbody.appendChild(tr);
      }
    }

    function openEditModal(serviceId) {
      for (var i = 0; i < services.length; i++) {
        if (services[i].id === serviceId) {
          document.getElementById("edit-service-id").value = serviceId;
          document.getElementById("edit-service-price").value = services[i].originalPrice;
          document.getElementById("edit-service-discount").value = services[i].discountPercentage || 0;
          break;
        }
      }
      document.getElementById("editModal").classList.add("active");
    }

    function saveEdit() {
      var id = document.getElementById("edit-service-id").value;
      var price = parseInt(document.getElementById("edit-service-price").value);
      var discount = parseInt(document.getElementById("edit-service-discount").value) || 0;
      
      if (updateServicePrice(id, price, discount)) {
        saveServices();
        renderServicesTable();
        closeModal("editModal");
      }
    }

    function handleDeleteService(serviceId) {
      if (confirm(typeof t === 'function' ? t('admin.delete-confirm') : "Delete this service?")) {
        deleteService(serviceId);
        saveServices();
        renderServicesTable();
      }
    }

    function openAddModal() {
      document.getElementById("add-service-name").value = "";
      document.getElementById("add-service-name-ar").value = "";
      document.getElementById("add-service-price").value = "";
      document.getElementById("add-service-discount").value = "0";
      document.getElementById("add-service-image").value = "images/services/ui-ux.svg";
      document.getElementById("addModal").classList.add("active");
    }

    function saveAdd() {
      var name = document.getElementById("add-service-name").value.trim();
      var nameAr = document.getElementById("add-service-name-ar").value.trim();
      var price = parseInt(document.getElementById("add-service-price").value);
      var discount = parseInt(document.getElementById("add-service-discount").value) || 0;
      var image = document.getElementById("add-service-image").value.trim() || "images/services/ui-ux.svg";
      
      if (!name) { alert("Service name is required"); return; }
      if (!price || price < 0) { alert("Valid price is required"); return; }
      
      var newService = {
        id: name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, ''),
        name: { en: name, ar: nameAr || name },
        description: { en: name, ar: nameAr || name },
        originalPrice: price,
        discountPercentage: discount,
        image: image,
        currency: "AED",
        steps: []
      };
      
      addService(newService);
      saveServices();
      renderServicesTable();
      closeModal("addModal");
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove("active");
    }

    document.addEventListener("DOMContentLoaded", function() {
      renderServicesTable();
    });
  </script>
  <script src="js/protect.js"></script>
</body>
</html>
