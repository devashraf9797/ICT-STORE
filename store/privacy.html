<!DOCTYPE html>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Cairo Arabic Font + Inter English Font -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Global Styles -->
<style>
    body { font-family: Arial, sans-serif; padding: 0; margin: 0; }
    .navbar { background: #111827; padding: 16px; display: flex; justify-content: space-between; align-items: center; position: fixed; top: 0; left: 0; right: 0; z-index: 50; }
    .logo { color: #FBBF24; font-size: 24px; font-weight: bold; text-decoration: none; }
    .menu-btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; min-width: 44px; min-height: 44px; }
    .mobile-menu { 
      background: #111827; 
      padding: 0 16px; 
      position: fixed; 
      top: 60px; 
      left: 0; 
      right: 0; 
      z-index: 40; 
      max-height: 0; 
      overflow: hidden; 
      transition: max-height 0.3s ease-out, padding 0.3s ease-out;
    }
    .mobile-menu.active { 
      max-height: 400px; 
      padding: 16px; 
    }
    .mobile-menu a { color: white; display: block; padding: 8px; text-decoration: none; }
    .mobile-menu a:hover { color: #FBBF24; }
  </style>
  
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-navy text-white">

  <nav class="navbar">
    <a href="index.html" class="logo">ASH CS</a>

    <button class="menu-btn" onclick="toggleMenu()">☰</button>

      <a href="info.html" data-i18n="nav.info">Info</a>
      <a href="entry.html" style="color: #D4AF37; font-weight: bold;" data-i18n="nav.seller-login">Seller Login</a>
      <a href="admin.html" id="admin-link" style="color: #D4AF37; font-weight: bold; display: none;" data-i18n="nav.admin-panel">Admin Panel</a>
      <button id="lang-switch" style="background: #FBBF24; color: #111827; font-weight: bold; min-height: 44px; padding: 8px 16px; border-radius: 8px; border: none; width: 100%; text-align: left; margin-top: 8px;" data-i18n="lang.switch">AR</button>
    </div>
  </nav>

  <!-- Privacy Policy Section -->
  <section class="container mx-auto px-4 py-8 sm:py-16">
    <h2 data-en="Privacy Policy" data-ar="سياسة الخصوصية" class="text-3xl sm:text-4xl font-bold mb-8 sm:mb-12 text-gold text-center"></h2>
    
    <div class="max-w-4xl mx-auto bg-navy-light rounded-xl shadow-2xl border border-gold/20 p-6 sm:p-10 space-y-8">
      <div class="border-r-4 border-gold pr-4 sm:pr-6">
        <h3 data-en="Information We Collect" data-ar="المعلومات التي نجمعها" class="text-xl sm:text-2xl font-bold text-gold mb-3"></h3>
        <p data-en="We collect information you provide when placing an order (name, email, phone) and automatically via cookies for site functionality." 
              data-ar="نحن نجمع المعلومات التي تقدمها عند وضع طلب (الاسم، البريد الإلكتروني، الهاتف) وأوتوماتيكياً عبر ملفات تعريف الارتباط لوظائف الموقع." 
              class="text-gray-300 leading-relaxed"></p>
      </div>
      
      <div class="border-r-4 border-gold pr-4 sm:pr-6">
        <h3 data-en="How We Use Your Information" data-ar="كيف نستخدم معلوماتك" class="text-xl sm:text-2xl font-bold text-gold mb-3"></h3>
        <p data-en="We use your information to process orders, communicate with you via WhatsApp/Email, and improve our services." 
              data-ar="نستخدم معلوماتك لمعالجة الطلبات، والتواصل معك عبر واتساب/البريد الإلكتروني، وتحسين خدماتنا." 
              class="text-gray-300 leading-relaxed"></p>
      </div>
      
      <div class="border-r-4 border-gold pr-4 sm:pr-6">
        <h3 data-en="Information Sharing" data-ar="مشاركة المعلومات" class="text-xl sm:text-2xl font-bold text-gold mb-3"></h3>
        <p data-en="We do not sell your personal information. We share it only with service providers necessary to complete your order (e.g., Formspree for emails)." 
              data-ar="نحن لا نبيع معلوماتك الشخصية. نشاركها فقط مع مزودي الخدمات الضروريين لإكمال طلبك (مثل Formspree للرسائل الإلكترونية)." 
              class="text-gray-300 leading-relaxed"></p>
      </div>
      
      <div class="border-r-4 border-gold pr-4 sm:pr-6">
        <h3 data-en="Data Security" data-ar="أمن البيانات" class="text-xl sm:text-2xl font-bold text-gold mb-3"></h3>
        <p data-en="We implement security measures to protect your data, including SSL encryption and secure third-party processors." 
              data-ar="نحن ننفذ تدابير أمنية لحماية بياناتك، بما في ذلك تشفير SSL ومعالجات خارجية آمنة." 
              class="text-gray-300 leading-relaxed"></p>
      </div>
      
      <div class="border-r-4 border-gold pr-4 sm:pr-6">
        <h3 data-en="Your Rights" data-ar="حقوقك" class="text-xl sm:text-2xl font-bold text-gold mb-3"></h3>
        <p data-en="You have the right to access, update, or delete your personal information. Contact us to exercise these rights." 
              data-ar="لديك الحق في الوصول إلى معلوماتك الشخصية وتحديثها أو حذفها. اتصل بنا لممارسة هذه الحقوق." 
              class="text-gray-300 leading-relaxed"></p>
      </div>
      
      <div class="border-r-4 border-gold pr-4 sm:pr-6">
        <h3 data-en="Contact Us" data-ar="اتصل بنا" class="text-xl sm:text-2xl font-bold text-gold mb-3"></h3>
        <p data-en="If you have questions about this Privacy Policy, contact us at finalproject900@gmail.com or +971507052670." 
              data-ar="إذا كان لديك أسئلة حول سياسة الخصوصية هذه، اتصل بنا على finalproject900@gmail.com أو +971507052670." 
              class="text-gray-300 leading-relaxed"></p>
      </div>
      
      <div class="mt-8 pt-6 border-t border-gold/20 text-center">
        <p data-en="Last Updated: January 2026" data-ar="آخر تحديث: يناير 2026" class="text-gray-400 text-sm"></p>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-navy-light py-8 px-4 mt-16 border-t border-gold/20">
    <div class="container mx-auto flex flex-wrap justify-center gap-6 sm:gap-8">
      <a href="mailto:finalproject900@gmail.com" class="min-h-[44px] flex items-center text-gray-300 hover:text-gold transition-colors">finalproject900@gmail.com</a>
      <a href="privacy.html" class="min-h-[44px] flex items-center text-gold font-semibold" data-en="Privacy Policy" data-ar="سياسة الخصوصية">Privacy Policy</a>
    </div>
    <p class="text-center mt-6 text-gray-400" data-en="© 2026 Ash CS Creative Studio. All rights reserved." data-ar="© 2026 استوديو إش CS الإبداعي. جميع الحقوق محفوظة."></p>
  </footer>

  <!-- Floating Buttons Container -->
  <div id="floating-buttons" style="position: fixed; bottom: 32px; right: 32px; display: flex; flex-direction: column; gap: 16px; z-index: 999;">
    <!-- Floating Cart Button -->
    <a href="cart.html" style="background: #FBBF24; color: #111827; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(251,191,36,0.3); transition: transform 0.3s; text-decoration: none;" onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'">
      <svg width="30" height="30" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.2 2M7 13h10l2-8H5.4M7 13L5.4 5M7 13l-2.1 4M17 13a2 2 0 1 0 0 4 0z"></path>
      </svg>
    </a>

  </div>

  <script src="js/main.js"></script>

  <script src="js/protect.js"></script>
  <script>
    // Toggle mobile menu
    function toggleMenu() {
      const menu = document.getElementById("mobileMenu");
      if (menu) {
        menu.classList.toggle("active");
      }
    }
  </script>
</body>
</html>
