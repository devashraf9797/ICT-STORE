<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASH CS | Design & IT Services</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 0; margin: 0; background: #0A192F; }
    .navbar { background: #111827; padding: 16px; display: flex; justify-content: space-between; align-items: center; position: fixed; top: 0; left: 0; right: 0; z-index: 50; }
    .logo { color: #FBBF24; font-size: 24px; font-weight: bold; text-decoration: none; }
    .menu-btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; min-width: 44px; min-height: 44px; }
    .mobile-menu { background: #111827; padding: 0 16px; position: fixed; top: 60px; left: 0; right: 0; z-index: 40; max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out, padding 0.3s ease-out; }
    .mobile-menu.active { max-height: 400px; padding: 16px; }
    .mobile-menu a { color: white; display: block; padding: 8px; text-decoration: none; }
    .mobile-menu a:hover { color: #FBBF24; }
    .hero { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 80px 20px 40px; }
    .entry-card { background: #112240; padding: 48px; border-radius: 16px; text-align: center; max-width: 500px; width: 100%; border: 2px solid rgba(212,175,55,0.2); }
    .entry-btn { display: block; width: 100%; padding: 20px; border-radius: 12px; font-size: 20px; font-weight: bold; cursor: pointer; transition: all 0.3s; min-height: 60px; border: none; }
    .entry-btn:hover { transform: scale(1.05); }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; }
    .modal.active { display: flex !important; }
    .modal-content { background: #112240; padding: 32px; border-radius: 12px; max-width: 400px; width: 90%; border: 2px solid rgba(212,175,55,0.2); }
    .modal-content input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid rgba(212,175,55,0.2); border-radius: 8px; background: #0A192F; color: white; font-size: 16px; min-height: 44px; }
    .modal-content input:focus { outline: none; border-color: #D4AF37; }
    .error-msg { color: #ef4444; display: none; margin-top: 8px; font-size: 14px; }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <a href="index.html" class="logo">ASH CS</a>
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
    <div class="mobile-menu" id="mobileMenu">
      <a href="index.html" data-i18n="nav.home">Home</a>
      <a href="services.html" data-i18n="nav.services">Services</a>
      <a href="cart.html" data-i18n="nav.cart">Cart</a>
      <a href="about.html" data-i18n="nav.about">About</a>
      <a href="contact.html" data-i18n="nav.contact">Contact</a>
      <a href="info.html" data-i18n="nav.info">Info</a>
      <a href="entry.html" style="color: #D4AF37; font-weight: bold;" data-i18n="nav.seller-login">Seller Login</a>
      <a href="admin.html" id="admin-link" style="color: #D4AF37; font-weight: bold; display: none;" data-i18n="nav.admin-panel">Admin Panel</a>
      <button id="lang-switch" style="background: #FBBF24; color: #111827; font-weight: bold; min-height: 44px; padding: 8px 16px; border-radius: 8px; border: none; width: 100%; text-align: left; margin-top: 8px;" data-i18n="lang.switch">AR</button>
    </div>
  </nav>

  <!-- Hero -->
  <section class="hero">
    <div class="entry-card">
      <h1 style="font-size: 36px; font-weight: bold; color: #D4AF37; margin-bottom: 8px;" data-i18n="entry.title">ASH CS</h1>
      <p style="color: #e2e8f0; margin-bottom: 32px; font-size: 18px;" data-i18n="entry.sub">Design & IT Services UAE</p>
      
      <button onclick="window.location.href='services.html'" class="entry-btn" style="background: #FBBF24; color: #111827; margin-bottom: 16px;" data-i18n="btn.buyer">
        I'm a Buyer → Browse Services
      </button>
      
      <button onclick="openLoginModal()" class="entry-btn" style="background: transparent; color: #D4AF37; border: 2px solid #D4AF37;" data-i18n="btn.seller">
        I'm a Seller → Login
      </button>
    </div>
  </section>

  <!-- Login Modal -->
  <div class="modal" id="loginModal">
    <div class="modal-content">
      <h2 style="color: #D4AF37; font-size: 24px; font-weight: bold; margin-bottom: 24px; text-align: center;" data-i18n="entry.seller-login-title">Seller Login</h2>
      <input type="text" id="login-username" placeholder="Username" data-i18n="entry.username">
      <input type="password" id="login-password" placeholder="Password" data-i18n="entry.password">
      <p class="error-msg" id="login-error" data-i18n="entry.invalid">Invalid credentials. Try again.</p>
      <button onclick="handleLogin()" style="width: 100%; background: #D4AF37; color: #0A192F; font-weight: bold; min-height: 44px; border-radius: 8px; border: none; cursor: pointer; font-size: 16px; margin-top: 8px;" data-i18n="btn.login">Login</button>
      <button onclick="closeLoginModal()" style="width: 100%; background: transparent; color: #e2e8f0; font-weight: bold; min-height: 44px; border-radius: 8px; border: 1px solid #e2e8f0; cursor: pointer; font-size: 16px; margin-top: 8px;" data-i18n="btn.cancel">Cancel</button>
    </div>
  </div>

  <!-- Floating Buttons -->
  <div id="floating-buttons" style="position: fixed; bottom: 32px; right: 32px; display: flex; flex-direction: column; gap: 16px; z-index: 999;">
    <a href="cart.html" style="background: #FBBF24; color: #111827; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(251,191,36,0.3); transition: transform 0.3s; text-decoration: none;" onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'">
      <svg width="30" height="30" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.2 2M7 13h10l2-8H5.4M7 13L5.4 5M7 13l-2.1 4M17 13a2 2 0 1 0 0 4 0z"></path></svg>
    </a>

  </div>

  <script src="js/main.js"></script>
  <script>
    function toggleMenu() {
      document.getElementById("mobileMenu").classList.toggle("active");
    }

    function openLoginModal() {
      document.getElementById("loginModal").classList.add("active");
      document.getElementById("login-error").style.display = "none";
    }

    function closeLoginModal() {
      document.getElementById("loginModal").classList.remove("active");
    }

    function handleLogin() {
      var username = document.getElementById("login-username").value;
      var password = document.getElementById("login-password").value;
      
      if (username === "ASH97" && password === "Alshbah@97") {
        localStorage.setItem("isAdminLoggedIn", "true");
        window.location.href = "admin.html";
      } else {
        document.getElementById("login-error").style.display = "block";
        document.getElementById("login-password").value = "";
      }
    }

    // Close modal on outside click
    document.getElementById("loginModal").addEventListener("click", function(e) {
      if (e.target === this) closeLoginModal();
    });

    // Enter key to login
    document.addEventListener("keydown", function(e) {
      if (e.key === "Enter" && document.getElementById("loginModal").classList.contains("active")) {
        handleLogin();
      }
    });

    document.addEventListener("DOMContentLoaded", function() {
      var adminLink = document.getElementById("admin-link");
      if (adminLink && typeof isAdmin === 'function' && isAdmin()) {
        adminLink.style.display = 'block';
      }
    });
  </script>
  <script src="js/protect.js"></script>
</body>
</html>
